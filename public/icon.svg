<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container with Safe Zone Padding (15%) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle circular border -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#10b981" stroke-width="3" opacity="0.4"/>
  
  <!-- Center Shield / Insignia -->
  <path d="M 256 80 L 370 135 C 370 260 256 360 256 360 C 256 360 142 260 142 135 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- Open Academic Book inside Shield -->
  <path d="M 185 210 C 215 200 245 208 256 218 C 267 208 297 200 327 210 L 327 275 C 297 265 267 273 256 283 C 245 273 215 265 185 275 Z"
        fill="#ffffff" stroke="#064e3b" stroke-width="3"/>
  <line x1="256" y1="218" x2="256" y2="283" stroke="#064e3b" stroke-width="3"/>
  
  <!-- Graduation / Merit Cap -->
  <path d="M 256 130 L 320 160 L 256 190 L 192 160 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
  <path d="M 215 173 L 215 200 C 215 215 297 215 297 200 L 297 173" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <line x1="305" y1="168" x2="315" y2="215" stroke="#fef08a" stroke-width="3"/>
  <circle cx="315" cy="218" r="4" fill="#fef08a"/>
  
  <!-- Verified CBT Checkmark Star Badge -->
  <circle cx="256" cy="385" r="45" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4"/>
  <path d="M 240 385 L 252 397 L 275 372" fill="none" stroke="#022c22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bottom Text Label: FCTA CBT -->
  <text x="256" y="468" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#fbbf24" letter-spacing="4">FCTA CBT</text>
</svg>
